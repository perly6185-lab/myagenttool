<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prototype Canvas</title>
    <link rel="stylesheet" href="./prototype-canvas.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Prototype Canvas Phase 1</p>
          <h1>ASCII Imported Scene Review</h1>
        </div>
        <div class="toolbar" aria-label="Canvas controls">
          <button type="button" data-zoom-out aria-label="Zoom out">-</button>
          <output data-zoom-label>100%</output>
          <button type="button" data-zoom-in aria-label="Zoom in">+</button>
          <button type="button" data-reset-view>Reset view</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="surface-nav" aria-label="Prototype surfaces">
          <h2>Surfaces</h2>
          <div data-surface-list></div>
          <section class="boundary-card">
            <h3>Task Composer Boundary</h3>
            <p>High-frequency task input only. Advanced evidence and session detail stay in their own surfaces.</p>
          </section>
        </aside>

        <section class="canvas-panel" aria-label="Infinite prototype canvas">
          <div class="canvas-frame" data-canvas-frame>
            <div class="canvas-world" data-canvas-world></div>
          </div>
        </section>

        <aside class="inspector" aria-label="Selected region inspector">
          <h2>Inspector</h2>
          <p class="muted" data-selection-empty>Select a region or element.</p>
          <form data-inspector-form hidden>
            <label>
              Label
              <input type="text" data-label-input>
            </label>
            <label>
              Owner surface
              <input type="text" data-owner-input readonly>
            </label>
            <label>
              Prototype states
              <textarea rows="3" data-states-input readonly></textarea>
            </label>
            <label>
              What not to show
              <textarea rows="4" data-hidden-input readonly></textarea>
            </label>
            <p class="validation-message" data-validation-message>Ready.</p>
          </form>
        </aside>
      </section>
    </main>

    <script src="./prototype-canvas.js"></script>
  </body>
</html>
