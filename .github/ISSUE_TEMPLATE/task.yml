name: Task
description: A small implementation, documentation, or research task.
title: "[Task]: "
labels:
  - type/task
  - status/backlog
body:
  - type: input
    id: parent
    attributes:
      label: Parent initiative or epic
      placeholder: M0 Invocation Delivery
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: M0 / M1 / M2 / M3 / M4
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - server
        - desktop
        - protocol
        - security
        - billing
        - docs
        - cross-cutting
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - all
        - macos
        - windows
        - linux
        - server
        - web
        - none
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Work
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, assumptions, source docs, or constraints.
