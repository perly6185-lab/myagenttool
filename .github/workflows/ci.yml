name: CI

# Cost gate: every job is guarded by the ENABLE_GITHUB_HOSTED_RUNNERS repo
# variable, so wiring pull_request/push triggers here costs nothing until an
# admin flips the variable (tools/dev/ci-activate.mjs automates the flip +
# branch protection). Until then, `pnpm ci:simulate` executes these same run
# steps locally — the simulator parses this file, so the two cannot drift.

on:
  workflow_dispatch:
    inputs:
      desktop_os:
        description: Desktop smoke runner set
        required: true
        default: ubuntu
        type: choice
        options:
          - ubuntu
          - all
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository structure
        run: pnpm repo:check

      - name: Check documentation links
        run: pnpm docs:check

      - name: Check AI, release, and deploy tooling
        run: |
          pnpm ai:check
          pnpm release:check
          pnpm deploy:check

      - name: Typecheck
        run: pnpm typecheck

      # test:ci = every package's full test, except the desktop --check which
      # requires a locally configured Codex CLI (environment-dependent by
      # design); the desktop unit suite still runs.
      - name: Test
        run: pnpm test:ci

      # Refusal model chokepoint (#786): run the server suite with the event-log
      # guard in STRICT mode, so a gate that denies via a direct appendEvent(...)
      # — bypassing the single writer refuse() — fails the build. Production keeps
      # the guard warn-by-default (a live refusal must never become a 500); this
      # is a CI-only enforcement lane that keeps "structural coverage" honest.
      - name: Refusal chokepoint (strict)
        run: pnpm test:refusal-strict

      # tsc --noEmit and vitest never exercise the production bundler, so a green
      # PR could still fail `vite build` (bundler-only import/asset/plugin errors)
      # and break the deploy. Only apps/web has a build today; --if-present keeps
      # this a no-op for packages without one.
      - name: Build
        run: pnpm build

  # L4 evaluation gates that are deterministic and free of AI spend: the mock
  # provider exercises the eval plumbing, and the issue-gate cases assert
  # product behavior (the runner exits non-zero if any issue-gate case fails —
  # a product gate regression). Real-provider capability evals (ai:eval-heldout,
  # pm-brief with a live model) stay manual: they cost model spend.
  eval-gates:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sub-capability gates (mock provider, issue-gate must pass 100%)
        run: pnpm ai:eval-subcap

  desktop-smoke:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.desktop_os == 'all' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local desktop smoke
        run: pnpm smoke:local

  application-install-contract:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Application install contract
        run: node --test apps/server/test/application-install-plans.test.mjs apps/desktop/test/application-installer.test.mjs
