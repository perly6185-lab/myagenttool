name: CI

on:
  workflow_dispatch:
    inputs:
      desktop_os:
        description: Desktop smoke runner set
        required: true
        default: ubuntu
        type: choice
        options:
          - ubuntu
          - all

jobs:
  verify:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository structure
        run: pnpm repo:check

      - name: Check documentation links
        run: pnpm docs:check

      - name: Check AI, release, and deploy tooling
        run: |
          pnpm ai:check
          pnpm release:check
          pnpm deploy:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  desktop-smoke:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.desktop_os == 'all' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local desktop smoke
        run: pnpm smoke:local
