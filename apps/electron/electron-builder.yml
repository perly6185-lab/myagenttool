appId: com.myagenttool.desktop
productName: MyAgentTool
protocols:
  - name: MyAgentTool
    schemes:
      - myagenttool
copyright: Copyright (c) 2026 MyAgentTool
asar: false
npmRebuild: false

directories:
  output: apps/electron/release

files:
  - package.json
  - apps/electron/src/**
  - node_modules/@openai/codex/**
  - node_modules/@anthropic-ai/claude-code/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  - node_modules/@anthropic-ai/sdk/**
  - node_modules/@modelcontextprotocol/sdk/**
  - node_modules/imapflow/**
  - node_modules/mailparser/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
  - node_modules/zod/**
  - apps/server/package.json
  - apps/server/src/**
  - apps/desktop/package.json
  - apps/desktop/src/**
  - apps/web/package.json
  - apps/web/dist/**
  - packages/protocol/package.json
  - packages/protocol/src/**
  - packages/shared/package.json
  - packages/shared/src/**
  - packages/adapters/package.json
  - packages/adapters/src/**
  - tools/agents/**
  - tools/mail-mcp/package.json
  - tools/mail-mcp/src/**
  - tools/session-engine/package.json
  - tools/session-engine/src/**
  - tools/wechat-official-site/package.json
  - tools/wechat-official-site/src/**
  - tools/ai/package.json
  - tools/ai/src/**
  - "!**/test/**"
  - "!**/*.test.*"

# Keep certificate-free development packages launchable. The post-package
# signing check replaces this ad-hoc identity when an Apple identity is present.
# Distribution builds also require notarization credentials from the release host.
mac:
  identity: "-"
  hardenedRuntime: true

win:
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: apps/electron/vendor/portable-git
      to: portable-git
      filter:
        - "**/*"

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Utility
  synopsis: Local agent control plane and channel workspace
  description: Run MyAgentTool locally with a managed agent bridge and messaging channels.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MyAgentTool

artifactName: ${productName}-Setup-${version}-${arch}.${ext}
