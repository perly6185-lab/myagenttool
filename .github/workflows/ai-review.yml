name: AI Review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string
      provider:
        description: Model provider
        required: true
        default: mock
        type: choice
        options:
          - mock
          - openai

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate AI review draft
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER }}
        run: |
          PR_NUMBER="${{ inputs.pr }}"
          PROVIDER="${{ inputs.provider }}"
          pnpm ai:review -- --pr "$PR_NUMBER" --provider "$PROVIDER" --comment
