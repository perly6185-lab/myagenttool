name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: docs
        type: choice
        options:
          - docs
          - server
          - web
          - desktop
          - protocol
      environment:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
          - production
      version:
        description: Version or release identifier
        required: false
        type: string
      apply:
        description: Run real deployment adapter
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy preflight
        env:
          MYAGENTTOOL_DEPLOY_EVIDENCE_DIR: .myagenttool/deploy-runs
          MYAGENTTOOL_DEPLOY_APPROVED: ${{ secrets.MYAGENTTOOL_DEPLOY_PRODUCTION_APPROVED }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            pnpm deploy:preflight -- --target "${{ inputs.target }}" --environment "${{ inputs.environment }}" --version "${{ inputs.version }}"
          else
            pnpm deploy:preflight -- --target "${{ inputs.target }}" --environment "${{ inputs.environment }}"
          fi

      - name: Publish
        env:
          MYAGENTTOOL_DEPLOY_COMMAND_JSON: ${{ secrets.MYAGENTTOOL_DEPLOY_COMMAND_JSON }}
          MYAGENTTOOL_DEPLOY_DOCS_PREVIEW_COMMAND_JSON: ${{ secrets.MYAGENTTOOL_DEPLOY_DOCS_PREVIEW_COMMAND_JSON }}
          MYAGENTTOOL_DEPLOY_PREVIEW_COMMAND_JSON: ${{ secrets.MYAGENTTOOL_DEPLOY_PREVIEW_COMMAND_JSON }}
          MYAGENTTOOL_DEPLOY_STAGING_COMMAND_JSON: ${{ secrets.MYAGENTTOOL_DEPLOY_STAGING_COMMAND_JSON }}
          MYAGENTTOOL_DEPLOY_PRODUCTION_COMMAND_JSON: ${{ secrets.MYAGENTTOOL_DEPLOY_PRODUCTION_COMMAND_JSON }}
          MYAGENTTOOL_DEPLOY_EVIDENCE_DIR: .myagenttool/deploy-runs
          MYAGENTTOOL_DEPLOY_APPROVED: ${{ secrets.MYAGENTTOOL_DEPLOY_PRODUCTION_APPROVED }}
        run: |
          ARGS="--target ${{ inputs.target }} --environment ${{ inputs.environment }}"
          if [ -n "${{ inputs.version }}" ]; then
            ARGS="$ARGS --version ${{ inputs.version }}"
          fi
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm deploy:publish -- $ARGS --apply
          else
            pnpm deploy:publish -- $ARGS
          fi

      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ inputs.target }}-${{ inputs.environment }}
          path: .myagenttool/deploy-runs/
