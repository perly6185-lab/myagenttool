name: Bug
description: A confirmed defect or broken behavior.
title: "[Bug]: "
labels:
  - type/bug
  - status/backlog
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - server
        - desktop
        - protocol
        - security
        - billing
        - docs
        - cross-cutting
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
