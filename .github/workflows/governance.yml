name: Governance

on:
  workflow_dispatch:
    inputs:
      check:
        description: Governance check to run
        required: true
        default: issues
        type: choice
        options:
          - issues
          - pull-request
      pr:
        description: Pull request number when check=pull-request
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pull-request-governance:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true' && inputs.check == 'pull-request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check local governance assets
        run: pnpm github:check

      - name: Check PR governance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm github:check:pr

  issue-hygiene:
    if: vars.ENABLE_GITHUB_HOSTED_RUNNERS == 'true' && inputs.check == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check issue hygiene
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm github:check:issues
