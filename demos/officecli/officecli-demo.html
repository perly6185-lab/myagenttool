        * { margin: 0; padding: 0; box-sizing: border-box; }

        .page-wrapper { margin: 0 auto 40px; transition: width 0.15s ease, height 0.15s ease; }
        .page { margin: 0 auto; padding: 72pt 90pt 72pt 90pt;

            display: flex; flex-direction: column; font-kerning: none; letter-spacing: 0;
            transform-origin: left top; transition: transform 0.15s ease;
            isolation: isolate;
            }
        /* The white page fill lives on a pseudo-element behind everything so a
           behind-text float (z-index:-1) paints ON the page, not under it. A
           background directly on .page would sit at the stacking-context root and
           hide any negative-z-index child (watermark/behind-doc image). */
        .page::before { content: ''; position: absolute; inset: 0; background: white;
            border-radius: 4px; z-index: -2; }
        /* break-word (not anywhere): a Latin word is only broken when it cannot
           fit on a line BY ITSELF; an oversized word beside a float first wraps
           to the next line. anywhere would break mid-word (produc-t) whenever
           the word does not fit the current inline gap, which is wrong for Latin.
           Table cells still need anywhere (see th,td rule below) so the R32
           fixed-grid column min-content collapses and long content wraps inside
           its column instead of overflowing the page. */
        .page-body { flex: 1; display: flex; flex-direction: column; text-autospace: ideograph-alpha ideograph-numeric; overflow-wrap: break-word;  }
        /* Multi-column sections: flex ignores column-count; switch to block. */
        .page-body[style*="column-count"] { display: block; }
        /* A table is typically full text-column width; inside a multi-column
           section it cannot fit one narrow column and would overflow into and
           overprint the adjacent column. Let tables span all columns (Word
           renders a full-width table across the section, with body text
           flowing in columns above/below it). */
        [style*="column-count"] > table { column-span: all; }
        /* Continuation page-bodies (created by pagination JS when content
           overflows): the segment leader was already at its computed offset
           in the source body, so its server-rendered margin-top must be
           zeroed when it becomes :first-child of a new page-body. The
           ORIGINAL page-body (which holds the document's first paragraph)
           is intentionally not matched here, so its first-paragraph
           spaceBefore renders the way Word emits it. */
        .page-body-cont > :first-child { margin-top: 0 !important; }
        .page-body > img + h1, .page-body > img + img + h1 { margin-top: 0 !important; }
        .doc-header, .doc-footer { font-size: 11pt; }
        /* Word paints the header/footer in a layer BEHIND the main body text
           (they are background bands, not foreground content). The header/footer
           is position:absolute, so without a z-index it would paint ABOVE the
           in-flow .page-body (positioned elements paint over non-positioned
           siblings at the same z-auto level). A full-bleed cover banner floated
           into the header would then occlude the body text on every page. Pin
           the band to z-index:-1 so body text (z-auto) paints on top of it, yet
           it stays ABOVE the white page fill (.page::before at z-index:-2). This
           also makes the cover-page white title overlay the banner correctly. */

            padding-bottom: 0.3em; z-index: -1; }

        .toc a span { color: inherit !important; text-decoration: none !important; }
        /* TOC entries authored as a fldChar field (HYPERLINK \l ... between
           begin/separate/end) render as plain spans, NOT wrapped in <a>. Word
           does not apply the Hyperlink character-style color/underline to a
           TOC field's internal links — entries take the toc-N paragraph color
           (black/auto by default). Mirror the .toc a span suppression for the
           un-wrapped case so the Hyperlink rStyle blue does not leak through.
           color:inherit recovers an explicit toc-N paragraph/style color (e.g.

        .hyphen-leader { flex: 1; border-bottom: 1px dashed #000; margin: 0 4px; min-width: 2em; align-self: flex-end; margin-bottom: 0.25em; }

        /* CONSISTENCY(run-special-content): w:ptab anchors header/footer

           ptabs becomes a flex container so .ptab-spacer (and the leader
           variants above) can flex-grow to push siblings apart. */

           trailing page-number segment lands at the right edge. */

        /* Three-part Left-tab-Center-tab-Right header/paragraph: the
           paragraph is a no-wrap flex row and each .atab-band flex-grows,
           text-aligned (left/center/right) per its own tab stop's Val. nowrap
           keeps all bands on one line (Word never wraps these).
           flex-basis is `auto` (band's intrinsic content width), not `0`
           (forced equal thirds): when every band is short the free space splits
           ~evenly (grow:1 each) so Center/Right still land mid/right exactly
           like a three-part header, but a long band (a TOC entry's full title)
           grows to fit its content and pushes its neighbours rather than being
           capped to a third. No overflow:hidden / text-overflow:ellipsis — a
           tab advances the pen to AT LEAST the stop and over-long content

           ''don't clip body text at a tab'' principle as the positional-tab
           min-width path. */

  // body flex-wrap tile them into _gridCols columns. cellW comes from the CLI
  // (window._gridCellW) so the captured viewport height (computed C#-side from
  // page count) matches the laid-out grid exactly. Mirrors flushScreenshotPage's
  // chrome-stripping but for ALL pages instead of clipping to one.
  function layoutGrid(cols){
    if(!cols||cols<1)return;
    var gap=12,pad=12;
    // Derive cellW from the live content width (excludes any scrollbar) so the
    // requested column count always fits — trusting a CLI-passed width risks the
    // scrollbar/rounding pushing the last column to a new row. Floor for safety.
    var avail=document.body.clientWidth-2*pad;
    var cellW=Math.floor((avail-(cols-1)*gap)/cols);
    if(cellW<1)cellW=window._gridCellW||220;
    var wraps=Array.prototype.filter.call(document.querySelectorAll('.page-wrapper'),function(w){return w.offsetParent!==null;});
    wraps.forEach(function(wrapper){
      var page=wrapper.querySelector('.page');if(!page)return;
      var pageW=page.offsetWidth,pageH=page.offsetHeight;
      var s=pageW>0?cellW/pageW:1;
      page.style.transition='none';page.style.transformOrigin='top left';
      page.style.transform='scale('+s+')';
      page.style.boxShadow='none';page.style.borderRadius='0';
      wrapper.style.transition='none';wrapper.style.margin='0';
      wrapper.style.width=cellW+'px';wrapper.style.height=Math.round(pageH*s)+'px';
      wrapper.style.overflow='hidden';
    });
    var b=document.body;
    b.style.display='flex';b.style.flexWrap='wrap';
    b.style.alignContent='flex-start';b.style.justifyContent='center';b.style.alignItems='flex-start';
    b.style.gap=gap+'px';b.style.padding=pad+'px';
  }
  function _loadKatexLazy(cb){
    // Watch mode: doc may start formula-free (KaTeX tags omitted), then
    // gain a formula via SSE patch. Inject CSS + JS on demand; on load,
    // re-invoke the caller so the new formula renders.
    if(window._katexLoading){window._katexCallbacks=window._katexCallbacks||[];window._katexCallbacks.push(cb);return;}
    window._katexLoading=true;window._katexCallbacks=[cb];
    // CONSISTENCY(katex-mirror): mirror-first, CDN retry, then plain-text fallback.
    var link=document.createElement('link');link.rel='stylesheet';link.href='https://d.officecli.ai/assets/katex-0.16.11/katex.min.css';link.onerror=function(){if(!this.dataset.f){this.dataset.f=1;this.href='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';}else{this.remove();}};document.head.appendChild(link);
    var _kOk=function(){(window._katexCallbacks||[]).forEach(function(f){try{f();}catch(e){}});window._katexCallbacks=[];};
    var _kFail=function(){document.querySelectorAll('.katex-formula:not(.katex-rendered)').forEach(function(el){el.textContent=el.dataset.formula;el.style.fontFamily='monospace';el.style.color='#666';el.classList.add('katex-rendered');});};
    var s=document.createElement('script');s.src='https://d.officecli.ai/assets/katex-0.16.11/katex.min.js';s.onload=_kOk;
    s.onerror=function(){var s2=document.createElement('script');s2.src='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';s2.onload=_kOk;s2.onerror=_kFail;document.head.appendChild(s2);};
    document.head.appendChild(s);
  }
  function renderNewContent(){
    var pending=document.querySelectorAll('.katex-formula:not(.katex-rendered)');
    if(typeof katex!=='undefined'){
      pending.forEach(function(el){
        try{katex.render(el.dataset.formula,el,{throwOnError:false,displayMode:!!el.dataset.display});}catch(e){el.textContent=el.dataset.formula;}
        el.classList.add('katex-rendered');
      });
    }else if(pending.length>0){
      _loadKatexLazy(renderNewContent);
    }
    // CJK punctuation compression on new content
    var cjkRe=/([\u3000-\u303F\uFF01-\uFF60\uFE30-\uFE4F\u2014\u2015\u2026\u2018\u2019\u201C\u201D])/;
    document.querySelectorAll('.page-body').forEach(function(body){
      var tw=document.createTreeWalker(body,NodeFilter.SHOW_TEXT);
      var nodes=[];while(tw.nextNode()){var n=tw.currentNode;if(!n.parentNode||!n.parentNode.classList||!n.parentNode.classList.contains('cjk-done'))nodes.push(n);}
      nodes.forEach(function(nd){
        if(!cjkRe.test(nd.textContent))return;
        var parts=nd.textContent.split(cjkRe);
        if(parts.length<=1)return;
        var frag=document.createDocumentFragment();
        for(var i=0;i<parts.length;i++){
          if(!parts[i])continue;
          if(cjkRe.test(parts[i])){var sp=document.createElement('span');sp.textContent=parts[i];sp.style.marginRight='-0.2em';sp.classList.add('cjk-done');frag.appendChild(sp);}
          else frag.appendChild(document.createTextNode(parts[i]));
        }
        nd.parentNode.replaceChild(frag,nd);
      });
    });
  }
  window._wordPaginate=function(){renderNewContent();setTimeout(paginate,0);};

  function scalePages(animate){
    var bs=getComputedStyle(document.body);
    var availW=document.body.clientWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight);
    if(!animate){
      document.querySelectorAll('.page-wrapper,.page').forEach(function(el){el.style.transition='none';});
    }
    document.querySelectorAll('.page-wrapper').forEach(function(wrapper){
      var page=wrapper.querySelector('.page');
      if(!page||page.style.display==='none')return;
      var pageW=page.offsetWidth;
      var pageH=page.offsetHeight;
      var s=Math.min(availW/pageW,1);
      page.style.transform='scale('+s+')';
      wrapper.style.height=(pageH*s)+'px';
      wrapper.style.width=(pageW*s)+'px';

    if(!animate){
      document.body.offsetHeight;
      document.querySelectorAll('.page-wrapper,.page').forEach(function(el){el.style.transition='';});
    }
    if(window._pendingScrollTo){
      var _sel=window._pendingScrollTo;
      var _beh=window._pendingScrollBehavior||'smooth';
      window._pendingScrollTo=null;
      window._pendingScrollBehavior=null;
      var _t;
      if(_sel==='_last_page'){var _lb=document.querySelector('.page-wrapper:last-of-type .page-body');if(_lb){var _ck=Array.from(_lb.children).filter(function(c){return !c.classList.contains('footnotes')&&c.style.display!=='none'&&c.offsetHeight>0;});_t=_ck[_ck.length-1]||_lb;}if(!_t){var _ap=document.querySelectorAll('.page');_t=_ap[_ap.length-1];}}
      else{_t=document.querySelector(_sel);if(!_t){var _ap=document.querySelectorAll('.page');_t=_ap[_ap.length-1];}}
      if(_t)_t.scrollIntoView({behavior:_beh,block:'center'});
    }

    if(_frz)_frz.remove();
  }
  var _resizeTimer;
  window.addEventListener('resize',function(){
    clearTimeout(_resizeTimer);
    _resizeTimer=setTimeout(function(){scalePages(true);},100);
  });
  var SCREENSHOT=location.hash.indexOf('screenshot')>=0||navigator.webdriver||/HeadlessChrome/.test(navigator.userAgent);
  window._wpSync=SCREENSHOT;
  if(SCREENSHOT){
    var rp=window._requestedPages;
    if(window._gridCols>0){paginate();}
    else if(rp&&rp.length===1&&rp[0]===1){
      // Page 1 is the first .page before pagination — flush it directly, skipping
      // the full paginate pass. Other single pages go through paginate and flush
      // at its sync completion. flushScreenshotPage clips + drops the chrome.
      document.querySelectorAll('.page-wrapper:not(:first-of-type)').forEach(function(w){w.style.display='none';});
      var _p1=document.querySelector('.page');if(_p1)adjustHeaderPadding(_p1);
      positionFootnotes();wrapFloats();applyLineNumbers();
      flushScreenshotPage();
    }else{paginate();}
  }else{setTimeout(paginate,100);}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_wordInit);
else _wordInit();
